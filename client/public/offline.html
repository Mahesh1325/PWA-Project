<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline</title>
    <style>
      body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background:#f8fafc; color:#0f172a; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
      .card { background:white; padding:24px; border-radius:12px; box-shadow:0 10px 30px rgba(2,6,23,0.08); max-width:720px; text-align:center; }
      h1 { margin:0 0 8px 0 }
      p { margin:0 }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>This app works offline. Some features may be limited until you reconnect.</p>
    </div>
  </body>
</html>
